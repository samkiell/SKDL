name = "skdl-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Replaces the Python heartbeat_loop() (every 60s) from bot/main.py
[triggers]
crons = ["* * * * *"]

# Non-secret settings may go here under [vars]; defaults match bot/config.py:
# [vars]
# LINK_BASE_URL = "https://movies.samkiel.dev"
# WEB_PROXY_BASE_URL = "https://skdlm.vercel.app"
# CDN_TTL_HOURS = "6"
# MOVIEBOX_API_HOST_V2 = "h5-api.aoneroom.com"
# MOVIEBOX_DOWNLOAD_API_HOST = "h5.aoneroom.com"
# GROQ_MODEL = "openai/gpt-oss-120b"
#
# Secrets (set with `wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN
#   GROQ_API_KEY
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN   (or REDIS_URL=rediss://default:<token>@<host>:6379)
#   OPENSUBTITLES_API_KEY      (optional)
